name: Rust MCU CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: rust-mcu-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      xtensa_matrix: ${{ steps.matrix.outputs.xtensa_matrix }}
      has_jobs: ${{ steps.matrix.outputs.has_jobs }}
      has_xtensa: ${{ steps.matrix.outputs.has_xtensa }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate workspace and discover crate CI
        id: matrix
        env:
          EVENT: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          BASE_PUSH: ${{ github.event.before }}
        run: |
          if [[ "$EVENT" == "pull_request" ]]; then
            python3 .github/scripts/discover_ci.py --github-output "$GITHUB_OUTPUT" --base "$BASE_PR"
          elif [[ "$EVENT" == "push" && "$BASE_PUSH" != "0000000000000000000000000000000000000000" && -n "$BASE_PUSH" ]]; then
            python3 .github/scripts/discover_ci.py --github-output "$GITHUB_OUTPUT" --base "$BASE_PUSH"
          else
            python3 .github/scripts/discover_ci.py --github-output "$GITHUB_OUTPUT" --full
          fi
      - name: Reject tracked Cargo.lock files
        run: |
          if git ls-files | grep -E '(^|/)Cargo\.lock$'; then
            echo "Cargo.lock files must not be tracked" >&2
            exit 1
          fi

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Gate 0: discovery and format must both pass before expensive toolchain setup.
  prepare-xtensa:
    name: Prepare Xtensa / ${{ matrix.variant }}
    needs: [discover, format]
    if: needs.discover.outputs.has_xtensa == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: pinned
            version: '1.98.1.0'
          - variant: latest
            version: latest
    steps:
      - uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          buildtargets: esp32s3
          default: false
          override: false
          version: ${{ matrix.version }}
          github-token: ${{ github.token }}
      - name: Bundle compiler once
        run: |
          test -x "$HOME/.rustup/toolchains/esp/bin/rustc"
          tar -C "$HOME/.rustup/toolchains" -cf "$RUNNER_TEMP/xtensa.tar" esp
      - uses: actions/upload-artifact@v4
        with:
          name: xtensa-${{ matrix.variant }}
          path: ${{ runner.temp }}/xtensa.tar
          retention-days: 1
          compression-level: 0

  crate:
    name: ${{ matrix.package }} / ${{ matrix.chip }}
    needs: [discover, format, prepare-xtensa]
    if: needs.discover.outputs.has_jobs == 'true' && (needs.discover.outputs.has_xtensa != 'true' || needs.prepare-xtensa.result == 'success')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.chip == 'host'
        with:
          components: clippy
      - uses: dtolnay/rust-toolchain@nightly
        if: matrix.chip == 'esp32c3'
        with:
          targets: riscv32imc-unknown-none-elf
          components: rust-src
      - uses: actions/download-artifact@v4
        if: matrix.chip == 'esp32s3'
        with:
          name: xtensa-pinned
          path: ${{ runner.temp }}/xtensa
      - name: Activate shared Xtensa compiler
        if: matrix.chip == 'esp32s3'
        run: |
          mkdir -p "$RUNNER_TEMP/xtensa/unpacked"
          tar -C "$RUNNER_TEMP/xtensa/unpacked" -xf "$RUNNER_TEMP/xtensa/xtensa.tar"
          rustup toolchain link esp "$RUNNER_TEMP/xtensa/unpacked/esp"
          cargo +esp --version
      - name: Host tests
        if: matrix.chip == 'host'
        env:
          PKG: ${{ matrix.package }}
        run: cargo test -p "$PKG"
      - name: Host Clippy (including tests)
        if: matrix.chip == 'host'
        env:
          PKG: ${{ matrix.package }}
        run: cargo clippy -p "$PKG" --all-targets -- -D warnings
      - name: ESP32-C3 cross-check
        if: matrix.chip == 'esp32c3'
        env:
          PKG: ${{ matrix.package }}
          TARGETS: ${{ matrix.targets }}
        run: |
          cargo +nightly check -Z build-std=core,alloc \
            --target riscv32imc-unknown-none-elf \
            -p "$PKG" --features esp32c3 "--$TARGETS"
      - name: ESP32-S3 cross-check
        if: matrix.chip == 'esp32s3'
        env:
          PKG: ${{ matrix.package }}
          TARGETS: ${{ matrix.targets }}
        run: |
          cargo +esp check -Z build-std=core,alloc \
            --target xtensa-esp32s3-none-elf \
            -p "$PKG" --features esp32s3 "--$TARGETS"

  xtensa-latest:
    name: Xtensa latest / ${{ matrix.package }}
    needs: [discover, format, prepare-xtensa]
    if: needs.discover.outputs.has_xtensa == 'true' && needs.prepare-xtensa.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.xtensa_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xtensa-latest
          path: ${{ runner.temp }}/xtensa
      - name: Activate shared latest Xtensa compiler
        run: |
          mkdir -p "$RUNNER_TEMP/xtensa/unpacked"
          tar -C "$RUNNER_TEMP/xtensa/unpacked" -xf "$RUNNER_TEMP/xtensa/xtensa.tar"
          rustup toolchain link esp "$RUNNER_TEMP/xtensa/unpacked/esp"
          cargo +esp --version
      - name: Verify ESP32-S3 against latest Xtensa Rust
        env:
          PKG: ${{ matrix.package }}
          TARGETS: ${{ matrix.targets }}
        run: |
          cargo +esp check -Z build-std=core,alloc \
            --target xtensa-esp32s3-none-elf \
            -p "$PKG" --features esp32s3 "--$TARGETS"

  affected-gate:
    name: Affected crate validation
    runs-on: ubuntu-latest
    needs: [discover, format, prepare-xtensa, crate, xtensa-latest]
    if: always()
    steps:
      - name: Confirm discovery and all selected checks passed
        env:
          DISCOVER: ${{ needs.discover.result }}
          FORMAT: ${{ needs.format.result }}
          CRATE: ${{ needs.crate.result }}
          PREPARE: ${{ needs.prepare-xtensa.result }}
          XTENSA: ${{ needs.xtensa-latest.result }}
          HAS_JOBS: ${{ needs.discover.outputs.has_jobs }}
          HAS_XTENSA: ${{ needs.discover.outputs.has_xtensa }}
        run: |
          [[ "$DISCOVER" == success && "$FORMAT" == success ]] || exit 1
          if [[ "$HAS_JOBS" == true ]]; then [[ "$CRATE" == success ]] || exit 1; fi
          if [[ "$HAS_XTENSA" == true ]]; then
            [[ "$PREPARE" == success && "$XTENSA" == success ]] || exit 1
          fi
