name: Rust MCU CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-mcu-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      xtensa_matrix: ${{ steps.matrix.outputs.xtensa_matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate workspace and discover crate CI
        id: matrix
        run: python3 .github/scripts/discover_ci.py --github-output "$GITHUB_OUTPUT"
      - name: Reject tracked Cargo.lock files
        run: |
          if git ls-files | grep -E '(^|/)Cargo\.lock$'; then
            echo "Cargo.lock files must not be tracked" >&2
            exit 1
          fi

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  crate:
    name: ${{ matrix.package }} / ${{ matrix.chip }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.chip == 'host'
        with:
          components: clippy
      - uses: dtolnay/rust-toolchain@nightly
        if: matrix.chip == 'esp32c3'
        with:
          targets: riscv32imc-unknown-none-elf
          components: rust-src
      - uses: esp-rs/xtensa-toolchain@v1.7.0
        if: matrix.chip == 'esp32s3'
        with:
          buildtargets: esp32s3
          default: false
          version: '1.98.1.0'
          github-token: ${{ github.token }}
      - name: Host tests
        if: matrix.chip == 'host'
        env:
          PKG: ${{ matrix.package }}
        run: cargo test -p "$PKG"
      - name: Host Clippy (including tests)
        if: matrix.chip == 'host'
        env:
          PKG: ${{ matrix.package }}
        run: cargo clippy -p "$PKG" --all-targets -- -D warnings
      - name: ESP32-C3 cross-check
        if: matrix.chip == 'esp32c3'
        env:
          PKG: ${{ matrix.package }}
          TARGETS: ${{ matrix.targets }}
        run: |
          cargo +nightly check -Z build-std=core,alloc \
            --target riscv32imc-unknown-none-elf \
            -p "$PKG" --features esp32c3 "--$TARGETS"
      - name: ESP32-S3 cross-check
        if: matrix.chip == 'esp32s3'
        env:
          PKG: ${{ matrix.package }}
          TARGETS: ${{ matrix.targets }}
        run: |
          cargo +esp check -Z build-std=core,alloc \
            --target xtensa-esp32s3-none-elf \
            -p "$PKG" --features esp32s3 "--$TARGETS"

  xtensa-latest:
    name: Xtensa latest / ${{ matrix.package }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.xtensa_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          buildtargets: esp32s3
          default: false
          version: latest
          github-token: ${{ github.token }}
      - name: Verify ESP32-S3 against latest Xtensa Rust
        env:
          PKG: ${{ matrix.package }}
          TARGETS: ${{ matrix.targets }}
        run: |
          cargo +esp check -Z build-std=core,alloc \
            --target xtensa-esp32s3-none-elf \
            -p "$PKG" --features esp32s3 "--$TARGETS"
