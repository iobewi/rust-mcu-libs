name: Rust MCU CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-mcu-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable Rust (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format portable crates
        run: cargo fmt --all -- --check
      - name: Test portable crates
        run: >-
          cargo test
          -p iobewi-config-space
          -p iobewi-nvs-core
          -p iobewi-wifi-core
          -p iobewi-wifi-manager
      - name: Clippy portable crates
        run: >-
          cargo clippy
          -p iobewi-config-space
          -p iobewi-nvs-core
          -p iobewi-wifi-core
          -p iobewi-wifi-manager
          --all-targets -- -D warnings
      - name: Enforce library lockfile policy
        run: |
          if git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            echo "Cargo.lock must not be tracked in rust-mcu-libs" >&2
            exit 1
          fi
          if git ls-files | grep -E '(^|/)Cargo\.lock$'; then
            echo "Tracked Cargo.lock found" >&2
            exit 1
          fi

  esp32c3:
    name: ESP32-C3 / ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: iobewi-esp-config-space
            features: esp32c3
          - package: iobewi-esp-wifi
            features: esp32c3
          - package: example-config-manager
            features: esp32c3
          - package: example-wifi-modes
            features: esp32c3
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: riscv32imc-unknown-none-elf
          components: rust-src
      - name: Check C3 package and associated binaries
        run: >-
          cargo +nightly check
          -Z build-std=core,alloc
          --target riscv32imc-unknown-none-elf
          -p ${{ matrix.package }}
          --features ${{ matrix.features }}
          --lib --bins

  esp32s3:
    name: ESP32-S3 / ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: iobewi-esp-config-space
            features: esp32s3
          - package: iobewi-esp-wifi
            features: esp32s3
          - package: example-config-manager
            features: esp32s3
          - package: example-wifi-modes
            features: esp32s3
    steps:
      - uses: actions/checkout@v4
      - uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          buildtargets: esp32s3
          default: false
      - name: Check S3 package and associated binaries
        run: >-
          cargo +esp check
          -Z build-std=core,alloc
          --target xtensa-esp32s3-none-elf
          -p ${{ matrix.package }}
          --features ${{ matrix.features }}
          --lib --bins
