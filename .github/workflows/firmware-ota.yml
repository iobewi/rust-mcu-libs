name: Firmware OTA CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '47 3 * * *'

permissions:
  contents: read

concurrency:
  group: firmware-ota-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      host_matrix: ${{ steps.matrix.outputs.host_matrix }}
      mcu_matrix: ${{ steps.matrix.outputs.mcu_matrix }}
      has_host: ${{ steps.matrix.outputs.has_host }}
      has_mcu: ${{ steps.matrix.outputs.has_mcu }}
      esp32c3_packages: ${{ steps.matrix.outputs.esp32c3_packages }}
      esp32s3_packages: ${{ steps.matrix.outputs.esp32s3_packages }}
      has_esp32c3: ${{ steps.matrix.outputs.has_esp32c3 }}
      has_esp32s3: ${{ steps.matrix.outputs.has_esp32s3 }}
      xtensa_matrix: ${{ steps.matrix.outputs.xtensa_matrix }}
      has_jobs: ${{ steps.matrix.outputs.has_jobs }}
      has_xtensa: ${{ steps.matrix.outputs.has_xtensa }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate workspace and discover crate CI
        id: matrix
        env:
          EVENT: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          BASE_PUSH: ${{ github.event.before }}
        run: |
          if [[ "$EVENT" == "pull_request" ]]; then
            python3 .github/scripts/discover_ci.py --github-output "$GITHUB_OUTPUT" --base "$BASE_PR" --domain firmware-ota
          elif [[ "$EVENT" == "push" && "$BASE_PUSH" != "0000000000000000000000000000000000000000" && -n "$BASE_PUSH" ]]; then
            python3 .github/scripts/discover_ci.py --github-output "$GITHUB_OUTPUT" --base "$BASE_PUSH" --domain firmware-ota
          else
            python3 .github/scripts/discover_ci.py --github-output "$GITHUB_OUTPUT" --full --domain firmware-ota
          fi
      - name: Test console stamp checker
        run: python3 .github/scripts/test_esp_console.py
      - name: Validate boot image size gate
        run: python3 .github/scripts/test_compile_mcu.py
      - name: Validate the flash geometry tool
        run: python3 .github/scripts/test_esp_geometry.py
      - name: Validate CI domain partition and selection scenarios
        run: python3 .github/scripts/test_discover_ci.py
      - name: Validate OTA gate logic
        run: python3 .github/scripts/test_ota_gate.py
      - name: Validate the ELF footprint tool
        run: python3 .github/scripts/test_elf_size.py
      - name: Reject the retired boot-metadata identifier
        run: python3 .github/scripts/check_retired_terms.py
      - name: Reject tracked Cargo.lock files
        run: |
          if git ls-files | grep -E '(^|/)Cargo\.lock$'; then
            echo "Cargo.lock files must not be tracked" >&2
            exit 1
          fi

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  host-tests:
    name: OTA host tests and Clippy / ${{ matrix.package }}
    needs: [discover, format]
    if: needs.discover.outputs.has_host == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.discover.outputs.host_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Unit tests
        env:
          PKG: ${{ matrix.package }}
          FEATURES: ${{ matrix.features }}
        run: cargo test -p "$PKG" --features "$FEATURES"
      - name: Clippy
        env:
          PKG: ${{ matrix.package }}
          FEATURES: ${{ matrix.features }}
        run: cargo clippy -p "$PKG" --features "$FEATURES" --all-targets -- -D warnings
      - name: Image authentication profiles (host)
        if: matrix.package == 'iobewi-firmware-auth'
        run: |
          # Unsigned profile: no asymmetric cryptography is even built.
          cargo test -p iobewi-firmware-auth
          cargo clippy -p iobewi-firmware-auth --all-targets -- -D warnings
          # Portable: the verifier also builds for a bare-metal target.
          rustup target add riscv32imc-unknown-none-elf
          cargo build -p iobewi-firmware-auth --features verify-p256 --target riscv32imc-unknown-none-elf
          cargo build -p iobewi-firmware-auth --target riscv32imc-unknown-none-elf
      - name: Flash geometry, both table offsets (host)
        if: matrix.package == 'iobewi-esp-boot' || matrix.package == 'iobewi-esp-partitions'
        env:
          PKG: ${{ matrix.package }}
        run: |
          set -euo pipefail
          # The tests cover both reference geometries whatever the build is configured for;
          # running them for each configured offset also proves the build-time setting is read.
          for offset in 0x8000 0x10000; do
            ESP_BOOTLOADER_ESP_IDF_CONFIG_PARTITION_TABLE_OFFSET=$offset cargo test -p "$PKG"
          done
          # An offset no table can have is refused when building, not at boot.
          for bad in 0x10001 0x4000 0x1c000; do
            if ESP_BOOTLOADER_ESP_IDF_CONFIG_PARTITION_TABLE_OFFSET=$bad cargo check -q -p iobewi-esp-partitions 2>/dev/null; then
              echo "table offset $bad was accepted"; exit 1
            fi
          done
      - name: Boot authentication (host, bare-metal build)
        if: matrix.package == 'iobewi-firmware-bootauth'
        run: |
          # The verifier crates run in the 32 KiB second stage: no_std, no allocation, no host-only code.
          rustup target add riscv32imc-unknown-none-elf
          cargo build -p iobewi-firmware-bootauth --target riscv32imc-unknown-none-elf
      - name: OTA reference firmware, both authentication profiles (host)
        if: matrix.package == 'example-firmware-ota-system'
        run: |
          cargo test -p example-firmware-ota-system --features signed
          cargo clippy -p example-firmware-ota-system --features signed --all-targets -- -D warnings
      - name: Transactional boot exhaustive fault injection
        if: matrix.package == 'iobewi-firmware-boot'
        run: cargo test --release -p iobewi-firmware-boot
      - name: Firmware OTA runtime feature tests and Clippy
        if: matrix.package == 'iobewi-firmware-update'
        run: |
          cargo test -p iobewi-firmware-update --features runtime
          cargo clippy -p iobewi-firmware-update --features runtime --all-targets -- -D warnings
          cargo test -p iobewi-firmware-update --features 'runtime config-space'
          cargo clippy -p iobewi-firmware-update --features 'runtime config-space' --all-targets -- -D warnings
          cargo test -p iobewi-firmware-update --features 'runtime nor-flash'
          cargo clippy -p iobewi-firmware-update --features 'runtime nor-flash' --all-targets -- -D warnings

  # Each MCU job compiles all selected crates on ONE runner.
  # Xtensa is installed once per compiler variant; no toolchain artifacts.
  esp32c3:
    name: OTA ESP32-C3 selected crates
    needs: [discover, format, host-tests]
    if: always() && needs.discover.result == 'success' && needs.format.result == 'success' && (needs.host-tests.result == 'success' || (needs.discover.outputs.has_host != 'true' && needs.host-tests.result == 'skipped')) && needs.discover.outputs.has_esp32c3 == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: riscv32imc-unknown-none-elf
          components: rust-src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile selected ESP32-C3 crates
        env:
          PACKAGES: ${{ needs.discover.outputs.esp32c3_packages }}
        run: |
          set -euo pipefail
          python3 .github/scripts/compile_mcu.py --chip esp32c3
      - name: Console transport matrix (esp32c3)
        if: contains(needs.discover.outputs.esp32c3_packages, 'iobewi-esp-console') || contains(needs.discover.outputs.esp32c3_packages, 'iobewi-esp-bootloader')
        run: python3 .github/scripts/console_matrix.py --chip esp32c3
      - name: Bootloader and application share the primary console (esp32c3)
        if: contains(needs.discover.outputs.esp32c3_packages, 'iobewi-esp-bootloader') && contains(needs.discover.outputs.esp32c3_packages, 'example-firmware-ota-system')
        run: |
          python3 .github/scripts/esp_console.py check \
            target/riscv32imc-unknown-none-elf/bootloader/iobewi-esp-bootloader \
            target/riscv32imc-unknown-none-elf/release/firmware-ota-system-esp32
      - name: Signed OTA profile, build and flash cost
        if: contains(needs.discover.outputs.esp32c3_packages, 'example-firmware-ota-system')
        env:
          # Public test fixture only (its private half is the test key of the
          # host suites); the firmware pins this key, it signs nothing.
          IOBEWI_OTA_SIGNING_PUBKEY: 04f869e567b81900d7b41aced0678a52a5a8400827784110eb78597ba75a34f9f5067f982914d934e1ecd85c6cf9c7e741eb25c1b197ec5113871b215448cd4c46
        run: |
          set -euo pipefail
          elf=target/riscv32imc-unknown-none-elf/release/firmware-ota-system-esp32
          cp "$elf" "$RUNNER_TEMP/unsigned.elf"
          cargo +nightly build -Z build-std=core,alloc --target riscv32imc-unknown-none-elf \
            -p example-firmware-ota-system --features esp32c3,signed --bins --release
          echo "### OTA flash footprint, esp32c3" >> "$GITHUB_STEP_SUMMARY"
          python3 .github/scripts/elf_size.py --compare "$RUNNER_TEMP/unsigned.elf" "$elf" --max-growth 65536 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: RSA-PSS OTA profile with boot proofs, build and flash cost
        if: contains(needs.discover.outputs.esp32c3_packages, 'example-firmware-ota-system')
        run: |
          set -euo pipefail
          # Public test fixture only (the private half exists nowhere in this repository); the
          # firmware pins this key and verifies through the ROM, it signs nothing.
          export IOBEWI_OTA_SIGNING_RSA_KEY="$(cat .github/fixtures/ota-signing-rsa-test-public.hex)"
          cargo +nightly build -Z build-std=core,alloc --target riscv32imc-unknown-none-elf \
            -p example-firmware-ota-system --features esp32c3,signed-rsa --bins --release
          elf=target/riscv32imc-unknown-none-elf/release/firmware-ota-system-esp32
          echo "### OTA flash footprint (RSA-PSS), esp32c3" >> "$GITHUB_STEP_SUMMARY"
          # Measured growth over the unsigned build: about 14 KiB (C3) and 17 KiB (S3).
          python3 .github/scripts/elf_size.py --compare "$RUNNER_TEMP/unsigned.elf" "$elf" --max-growth 32768 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Verified boot second stage, link and size gate
        if: contains(needs.discover.outputs.esp32c3_packages, 'iobewi-esp-bootloader')
        run: |
          pip install esptool==5.5.0
          python3 .github/scripts/verified_boot.py --chip esp32c3
      - name: Verified boot diagnostic build (diag-panic), link and size gate
        if: contains(needs.discover.outputs.esp32c3_packages, 'iobewi-esp-bootloader')
        run: |
          # Off by default, never in the nominal image; it must keep building and fitting
          # (docs/firmware/verified-boot-p3-diagnosis.md).
          python3 .github/scripts/verified_boot.py --chip esp32c3 --diag
      - name: Verified boot, other SHA-256 backends (esp-hal, software), link and size gate
        if: contains(needs.discover.outputs.esp32c3_packages, 'iobewi-esp-bootloader')
        run: |
          # Selectable at build time, the ROM's is the default and the one qualified on hardware;
          # these two must keep building and fitting (docs/firmware/verified-boot-sha.md).
          python3 .github/scripts/verified_boot.py --chip esp32c3 --sha hal
          python3 .github/scripts/verified_boot.py --chip esp32c3 --sha soft

  esp32s3:
    name: OTA ESP32-S3 selected crates / ${{ matrix.variant }}
    needs: [discover, format, host-tests]
    if: always() && needs.discover.result == 'success' && needs.format.result == 'success' && (needs.host-tests.result == 'success' || (needs.discover.outputs.has_host != 'true' && needs.host-tests.result == 'skipped')) && needs.discover.outputs.has_esp32s3 == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"include":[{"variant":"pinned","version":"1.98.1.0"}]}' || '{"include":[{"variant":"pinned","version":"1.98.1.0"},{"variant":"latest","version":"latest"}]}') }}
    steps:
      - uses: actions/checkout@v4
      - uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          buildtargets: esp32s3
          default: false
          override: false
          version: ${{ matrix.version }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile selected ESP32-S3 crates
        env:
          PACKAGES: ${{ needs.discover.outputs.esp32s3_packages }}
        run: |
          set -euo pipefail
          python3 .github/scripts/compile_mcu.py --chip esp32s3
      - name: Console transport matrix (esp32s3)
        if: contains(needs.discover.outputs.esp32s3_packages, 'iobewi-esp-console') || contains(needs.discover.outputs.esp32s3_packages, 'iobewi-esp-bootloader')
        run: python3 .github/scripts/console_matrix.py --chip esp32s3
      - name: Bootloader and application share the primary console (esp32s3)
        if: contains(needs.discover.outputs.esp32s3_packages, 'iobewi-esp-bootloader') && contains(needs.discover.outputs.esp32s3_packages, 'example-firmware-ota-system')
        run: |
          python3 .github/scripts/esp_console.py check \
            target/xtensa-esp32s3-none-elf/bootloader/iobewi-esp-bootloader \
            target/xtensa-esp32s3-none-elf/release/firmware-ota-system-esp32
      - name: Signed OTA profile, build and flash cost
        if: contains(needs.discover.outputs.esp32s3_packages, 'example-firmware-ota-system')
        env:
          # Public test fixture only (its private half is the test key of the
          # host suites); the firmware pins this key, it signs nothing.
          IOBEWI_OTA_SIGNING_PUBKEY: 04f869e567b81900d7b41aced0678a52a5a8400827784110eb78597ba75a34f9f5067f982914d934e1ecd85c6cf9c7e741eb25c1b197ec5113871b215448cd4c46
        run: |
          set -euo pipefail
          elf=target/xtensa-esp32s3-none-elf/release/firmware-ota-system-esp32
          cp "$elf" "$RUNNER_TEMP/unsigned.elf"
          cargo +esp build -Z build-std=core,alloc --target xtensa-esp32s3-none-elf \
            -p example-firmware-ota-system --features esp32s3,signed --bins --release
          echo "### OTA flash footprint, esp32s3" >> "$GITHUB_STEP_SUMMARY"
          python3 .github/scripts/elf_size.py --compare "$RUNNER_TEMP/unsigned.elf" "$elf" --max-growth 65536 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: RSA-PSS OTA profile with boot proofs, build and flash cost
        if: contains(needs.discover.outputs.esp32s3_packages, 'example-firmware-ota-system')
        run: |
          set -euo pipefail
          # Public test fixture only (the private half exists nowhere in this repository); the
          # firmware pins this key and verifies through the ROM, it signs nothing.
          export IOBEWI_OTA_SIGNING_RSA_KEY="$(cat .github/fixtures/ota-signing-rsa-test-public.hex)"
          cargo +esp build -Z build-std=core,alloc --target xtensa-esp32s3-none-elf \
            -p example-firmware-ota-system --features esp32s3,signed-rsa --bins --release
          elf=target/xtensa-esp32s3-none-elf/release/firmware-ota-system-esp32
          echo "### OTA flash footprint (RSA-PSS), esp32s3" >> "$GITHUB_STEP_SUMMARY"
          # Measured growth over the unsigned build: about 14 KiB (C3) and 17 KiB (S3).
          python3 .github/scripts/elf_size.py --compare "$RUNNER_TEMP/unsigned.elf" "$elf" --max-growth 32768 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Verified boot second stage, historical geometry (report only)
        if: contains(needs.discover.outputs.esp32s3_packages, 'iobewi-esp-bootloader')
        run: |
          pip install esptool==5.5.0
          # With the historical table at 0x8000 the S3 verified second stage does not fit
          # (docs/firmware/verified-boot.md): reported only. The wide geometry below is the gate.
          python3 .github/scripts/verified_boot.py --chip esp32s3 --report-only

      - name: Wide flash geometry (table at 0x10000), second stage and application
        if: contains(needs.discover.outputs.esp32s3_packages, 'iobewi-esp-bootloader') || contains(needs.discover.outputs.esp32s3_packages, 'example-firmware-ota-system')
        env:
          ESP_BOOTLOADER_ESP_IDF_CONFIG_PARTITION_TABLE_OFFSET: "0x10000"
        run: |
          set -euo pipefail
          pip install esptool==5.5.0
          target=target/xtensa-esp32s3-none-elf
          python3 .github/scripts/esp_geometry.py csv examples/firmware/ota-system/partitions-s3-16mb-wide.csv
          cargo +esp build -Z build-std=core,alloc --target xtensa-esp32s3-none-elf --profile bootloader \
            -p iobewi-esp-bootloader --features esp32s3 --bins
          python3 -m esptool --chip esp32s3 elf2image --flash-mode dio --flash-size 16MB \
            --output "$RUNNER_TEMP/boot-wide.bin" $target/bootloader/iobewi-esp-bootloader
          # Flash limits, geometry stamp and RAM placement of the linked second stage.
          python3 .github/scripts/esp_geometry.py image esp32s3 "$RUNNER_TEMP/boot-wide.bin" \
            --elf $target/bootloader/iobewi-esp-bootloader --profile unsigned | tee -a "$GITHUB_STEP_SUMMARY"
          # The verified profile fits this geometry: blocking.
          python3 .github/scripts/verified_boot.py --chip esp32s3
          # The application is built for the same table offset or the packaging refuses it.
          cargo +esp build -Z build-std=core,alloc --target xtensa-esp32s3-none-elf \
            -p example-firmware-ota-system --features esp32s3 --bins --release
          python3 -m esptool --chip esp32s3 elf2image --flash-size 16MB \
            --output "$RUNNER_TEMP/app-wide.bin" $target/release/firmware-ota-system-esp32
          test "$(python3 .github/scripts/esp_geometry.py stamp "$RUNNER_TEMP/app-wide.bin")" = "0x10000"
      - name: Verified boot diagnostic build (diag-panic), wide geometry
        if: contains(needs.discover.outputs.esp32s3_packages, 'iobewi-esp-bootloader')
        env:
          ESP_BOOTLOADER_ESP_IDF_CONFIG_PARTITION_TABLE_OFFSET: "0x10000"
        run: |
          # Last step on purpose: it replaces the linked second stage under target/.
          python3 .github/scripts/verified_boot.py --chip esp32s3 --diag
      - name: Verified boot, other SHA-256 backends (esp-hal, software), wide geometry
        if: contains(needs.discover.outputs.esp32s3_packages, 'iobewi-esp-bootloader')
        env:
          ESP_BOOTLOADER_ESP_IDF_CONFIG_PARTITION_TABLE_OFFSET: "0x10000"
        run: |
          python3 .github/scripts/verified_boot.py --chip esp32s3 --sha hal
          python3 .github/scripts/verified_boot.py --chip esp32s3 --sha soft

  firmware-ota-gate:
    name: Firmware OTA validation
    runs-on: ubuntu-latest
    needs: [discover, format, host-tests, esp32c3, esp32s3]
    if: always()
    steps:
      - name: Confirm discovery and every selected OTA check passed
        env:
          DISCOVER: ${{ needs.discover.result }}
          FORMAT: ${{ needs.format.result }}
          HOST: ${{ needs.host-tests.result }}
          C3: ${{ needs.esp32c3.result }}
          S3: ${{ needs.esp32s3.result }}
          HAS_HOST: ${{ needs.discover.outputs.has_host }}
          HAS_C3: ${{ needs.discover.outputs.has_esp32c3 }}
          HAS_S3: ${{ needs.discover.outputs.has_esp32s3 }}
          EVENT: ${{ github.event_name }}
          HAS_JOBS: ${{ needs.discover.outputs.has_jobs }}
        run: |
          [[ "$DISCOVER" == success && "$FORMAT" == success ]] || { echo "discovery or format did not succeed" >&2; exit 1; }
          # Fail closed on missing or malformed discovery outputs.
          for flag in "$HAS_HOST" "$HAS_C3" "$HAS_S3" "$HAS_JOBS"; do
            [[ "$flag" == true || "$flag" == false ]] || { echo "invalid discovery output: '$flag'" >&2; exit 1; }
          done
          # Scheduled and manual runs validate everything: an empty matrix is an error.
          if [[ "$EVENT" == schedule || "$EVENT" == workflow_dispatch ]]; then
            [[ "$HAS_JOBS" == true ]] || { echo "full validation selected no job" >&2; exit 1; }
          fi
          # A selected job must succeed; an unselected job must have been skipped, never failed or cancelled.
          check() { # name result selected
            if [[ "$3" == true ]]; then
              [[ "$2" == success ]] || { echo "$1 expected success, got $2" >&2; exit 1; }
            else
              [[ "$2" == skipped ]] || { echo "$1 not selected but result is $2" >&2; exit 1; }
            fi
          }
          check host-tests "$HOST" "$HAS_HOST"
          check esp32c3 "$C3" "$HAS_C3"
          check esp32s3 "$S3" "$HAS_S3"
