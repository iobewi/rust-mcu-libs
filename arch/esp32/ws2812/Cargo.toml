[package]
name = "iobewi-esp-ws2812"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license.workspace = true
repository.workspace = true
description = "ESP32 RMT driver for one WS2812 LED: a colour in, no policy"

[features]
default = []
esp32c3 = ["dep:esp-hal", "dep:esp-hal-smartled", "esp-hal/esp32c3"]
esp32s3 = ["dep:esp-hal", "dep:esp-hal-smartled", "esp-hal/esp32s3"]

[dependencies]
smart-leds-trait = "0.3"
esp-hal = { version = "~1.2", default-features = false, features = ["unstable"], optional = true }
esp-hal-smartled = { version = "~0.18", optional = true }
