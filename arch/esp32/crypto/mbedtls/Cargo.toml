[package]
name = "iobewi-crypto-mbedtls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "MbedTLS implementation of the TLS-material crypto contract: PEM/X.509 validation, identity generation, hooks"

[features]
default = []
# ESP32-S3 needs mbedtls-rs-sys's GCC path (see iobewi-esp-tls for the
# cmake-rs/Xtensa triple explanation).
use-gcc = ["mbedtls-rs/use-gcc"]
esp32c3 = ["portable-atomic/unsafe-assume-single-core"]
esp32s3 = ["use-gcc"]
# Public-PKI client trust (#21). Off by default: the server identity of this
# repository is a P-256 ECDSA certificate and needs none of it. Each feature
# adds flash; the sizes are in examples/https-client/README.md.
# Verify and negotiate RSA certificate chains (RSA-PKCS1 and RSA-PSS
# signatures, ECDHE-RSA key exchange): most public roots and intermediates.
rsa = ["mbedtls-rs/alg-rsa", "mbedtls-rs/alg-rsa-pss", "mbedtls-rs/kex-ecdhe-rsa"]
# secp384r1: ECDSA P-384 chains (for example ISRG Root X2) and certificates.
p384 = ["mbedtls-rs/curve-secp384r1"]
# X25519 key share, offered and chosen by most TLS 1.3 servers.
x25519 = ["mbedtls-rs/curve-curve25519"]
public-pki = ["rsa", "p384", "x25519"]

[dependencies]
iobewi-crypto-core = { path = "../../../../common/crypto/core" }
iobewi-entropy = { path = "../../../../common/crypto/rng" }
iobewi-time = { path = "../../../../common/time/core" }
log = { version = "0.4", default-features = false }
embassy-time = { version = "0.5.0", default-features = false }
static_cell = "2.1.1"
portable-atomic = { version = "1", default-features = false }
mbedtls-rs = { version = "0.3.0", default-features = false, features = [
  "tls-core", "tls-client", "tls-server",
  "tls-proto-tls12", "tls-proto-tls13",
  "x509-parse", "x509-write", "pk", "pem-parse", "pem-write", "base64",
  "alg-sha256", "alg-sha512", "alg-hkdf",
  "alg-ecp", "alg-ecdh", "alg-ecdsa", "curve-secp256r1",
  "alg-gcm", "alg-chacha20", "alg-chachapoly", "alg-aes", "cipher-mode-cbc",
  "kex-ecdhe-ecdsa",
  "drbg-ctr", "entropy",
  "tls-debug",
  "hook-wall-clock",
  "ssl-in-content-len-16384", "ssl-out-content-len-2048",
] }
