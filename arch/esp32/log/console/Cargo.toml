[package]
name = "iobewi-esp-console"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ESP console connector: the platform's primary console (UART0, USB Serial/JTAG or none) and optional secondary UARTs"

[features]
# The primary console is `IOBEWI_CONSOLE_PRIMARY` (iobewi-console, default uart0); exactly one
# `primary-*` feature must agree with it, or the build fails. UART0 is the default; another
# transport needs `default-features = false` on the dependency.
default = ["primary-uart0", "lock"]
primary-uart0 = ["esp-println?/uart"]
primary-usb-serial-jtag = ["esp-println?/jtag-serial"]
primary-none = ["esp-println?/no-op"]
# Write under esp-println's lock (interrupts masked per 64-byte chunk, both cores excluded).
# Applications keep it; the single-core, interrupt-free bootloader opts out.
lock = ["esp-println?/critical-section"]
esp32c3 = ["dep:esp-println", "esp-println/esp32c3", "esp-hal?/esp32c3"]
esp32s3 = ["dep:esp-println", "esp-println/esp32s3", "esp-hal?/esp32s3"]
# Application console on UART0 with a 2 KiB transmit ring and a UART `TxDone` drain: whole messages,
# no producer waits for the UART, no long critical section. Incompatible with `lock` (the direct
# path is also the panic path, which must not take a lock). Needs `esp-hal`'s unstable UART
# interrupt API. The bootloader does not use it.
ring = ["dep:esp-hal", "dep:critical-section", "esp-hal/unstable"]
# TEST INSTRUMENT, never in a product: lets a qualification image panic from inside the ring's pump
# (after the FIFO took bytes, before the ring forgot them), to observe that the panic path abandons
# the replay and still prints the fatal line. Absent from every default and application build.
fault-injection = ["ring"]
# Longest critical-section durations of the ring, for qualification.
ring-stats = ["ring"]
# Secondary console on UART1, taken by value from esp-hal (application only).
uart-secondary = ["dep:esp-hal", "dep:critical-section"]

[dependencies]
iobewi-console = { path = "../../../../common/log/console", features = ["log"] }
critical-section = { version = "1.2", optional = true }
esp-hal = { version = "~1.2", default-features = false, optional = true }
esp-println = { version = "~0.18", default-features = false, optional = true }
log = "0.4"
