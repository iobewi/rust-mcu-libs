[package]
name = "iobewi-esp-wifi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ESP Wi-Fi station and access point transport for esp-radio and Embassy networking"
repository.workspace = true
readme = "README.md"
keywords = ["esp32", "wifi", "embassy", "embedded", "no-std"]
categories = ["embedded", "network-programming", "no-std"]

[features]
default = []
esp32c3 = ["esp-hal/esp32c3", "esp-radio/esp32c3"]
esp32s3 = ["esp-hal/esp32s3", "esp-hal/rt", "esp-radio/esp32s3"]

[dependencies]
iobewi-wifi-core = { path = "../../../../common/net/wifi/core" }
embassy-executor = { version = "0.10.0", default-features = false }
embassy-time = { version = "0.5.0", default-features = false }
embassy-net = { version = "0.9.1", default-features = false, features = [
  "dhcpv4",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embassy-futures = { version = "0.1", default-features = false }
embassy-sync = { version = "0.8", default-features = false }
static_cell = "2"
# Access point address service: the DHCP server and its UDP socket factory.
edge-dhcp = { version = "0.8", default-features = false, features = ["io"] }
edge-nal = { version = "0.7", default-features = false }
edge-nal-embassy = { version = "0.9", default-features = false, features = [
  "medium-ethernet",
  "proto-ipv4",
  "udp",
] }
esp-hal = { version = "~1.2", default-features = false, features = ["unstable"] }
esp-radio = { version = "=1.0.0-beta.1", default-features = false, features = [
  "log-04",
  "unstable",
  "wifi",
] }
log = { version = "0.4.29", default-features = false }
