[package]
name = "iobewi-esp-firmware-a"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ESP32 legacy firmware A slot and otadata partition mapping"

[dependencies]
iobewi-firmware-slots = { path = "../../../../common/firmware/slots" }
iobewi-firmware-boot = { path = "../../../../common/firmware/boot" }
iobewi-firmware-layout = { path = "../../../../common/firmware/layout" }

[features]
default = []
esp32c3 = ["dep:iobewi-esp-flash", "iobewi-esp-flash/esp32c3", "dep:embedded-storage"]
esp32s3 = ["dep:iobewi-esp-flash", "iobewi-esp-flash/esp32s3", "dep:embedded-storage"]

[dependencies.iobewi-esp-flash]
path = "../../flash"
optional = true

[dependencies.embedded-storage]
version = "0.3.1"
optional = true
