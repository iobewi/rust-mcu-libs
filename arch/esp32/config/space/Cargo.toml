[package]
name = "iobewi-esp-config-space"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ESP shared NOR flash adapter for EKV ConfigSpace"
keywords = ["esp32", "configuration", "flash", "embedded", "no-std"]
categories = ["embedded", "hardware-support", "no-std"]

[features]
default = []
esp32c3 = [
  "iobewi-esp-flash/esp32c3",
  "dep:embedded-storage",
  "iobewi-esp-partitions/esp32c3",
]
esp32s3 = [
  "iobewi-esp-flash/esp32s3",
  "dep:embedded-storage",
  "iobewi-esp-partitions/esp32s3",
]

[dependencies]
iobewi-config-space = { path = "../../../../common/config/space" }
iobewi-esp-flash = { path = "../../flash", optional = true }

iobewi-esp-partitions = { path = "../../flash/partitions", optional = true }
embedded-storage = { version = "0.3.1", optional = true }

ekv = { version = "=1.0.0", features = ["crc", "max-value-size-8192", "max-chunk-size-256"] }

iobewi-firmware-layout = { path = "../../../../common/firmware/layout" }
