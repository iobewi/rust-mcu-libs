[package]
name = "example-https-health"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "https-health-esp32"
path = "src/main.rs"
required-features = ["firmware"]

[features]
default = []
firmware = []
esp32c3 = ["firmware", "esp-hal/esp32c3", "esp-rtos/esp32c3", "esp-radio/esp32c3", "esp-alloc/esp32c3", "esp-bootloader-esp-idf/esp32c3", "iobewi-esp-wifi/esp32c3", "iobewi-esp-console/esp32c3", "iobewi-esp-tls/esp32c3"]
esp32s3 = ["firmware", "esp-hal/esp32s3", "esp-rtos/esp32s3", "esp-radio/esp32s3", "esp-alloc/esp32s3", "esp-bootloader-esp-idf/esp32s3", "iobewi-esp-wifi/esp32s3", "iobewi-esp-console/esp32s3", "iobewi-esp-tls/esp32s3"]

[dependencies]
log = { version = "0.4", default-features = false }
iobewi-log = { path = "../../common/log/core" }
iobewi-esp-console = { path = "../../arch/esp32/log/console", default-features = false }
iobewi-esp-wifi = { path = "../../arch/esp32/net/wifi" }
iobewi-esp-tls = { path = "../../arch/esp32/net/tls", default-features = false }
iobewi-crypto-mbedtls = { path = "../../arch/esp32/crypto/mbedtls" }
iobewi-http-server = { path = "../../common/net/http/server" }
iobewi-wifi-core = { path = "../../common/net/wifi/core" }
esp-hal = { version = "~1.2", default-features = false, features = ["rt", "unstable"] }
esp-rtos = { version = "=0.4.0", default-features = false, features = ["embassy", "esp-radio", "esp-alloc"] }
esp-radio = { version = "=1.0.0-beta.1", default-features = false, features = ["wifi", "unstable"] }
esp-alloc = { version = "~0.11", default-features = false, features = ["global-allocator", "compat"] }
esp-bootloader-esp-idf = { version = "~0.6", default-features = false }
embassy-executor = { version = "0.10.0", default-features = false }
embassy-net = { version = "0.9.1", default-features = false, features = ["dhcpv4", "medium-ethernet", "tcp"] }
static_cell = "2.1"
