[package]
name = "example-state-indicator"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license.workspace = true
publish = false
autobins = false

[[bin]]
name = "state-indicator"
path = "src/main.rs"
required-features = ["firmware"]

[features]
default = []
firmware = []
# ESP32-S3-DevKitC-1 v1.1 wires the RGB LED to GPIO38 instead of GPIO48 (v1.0).
devkitc-1-v1-1 = []
esp32c3 = ["firmware", "esp-hal/esp32c3", "esp-rtos/esp32c3", "esp-bootloader-esp-idf/esp32c3", "iobewi-esp-console/esp32c3", "iobewi-esp-ws2812/esp32c3"]
esp32s3 = ["firmware", "esp-hal/esp32s3", "esp-rtos/esp32s3", "esp-bootloader-esp-idf/esp32s3", "iobewi-esp-console/esp32s3", "iobewi-esp-ws2812/esp32s3"]

[dependencies]
iobewi-state = { path = "../../common/state" }
iobewi-indicator = { path = "../../common/indicator" }
iobewi-esp-ws2812 = { path = "../../arch/esp32/ws2812" }
esp-hal = { version = "~1.2", default-features = false, features = ["rt", "unstable"] }
esp-rtos = { version = "=0.4.0", default-features = false, features = ["embassy"] }
esp-bootloader-esp-idf = { version = "~0.6", default-features = false }
iobewi-esp-console = { path = "../../arch/esp32/log/console" }
embassy-executor = { version = "0.10.0", default-features = false }
embassy-futures = { version = "0.1", default-features = false }
embassy-sync = { version = "0.8", default-features = false }
embassy-time = { version = "0.5", default-features = false }
static_cell = "2.1"
