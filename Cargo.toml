[workspace]
members = [
  "arch/esp32/usb",
  "arch/esp32/ws2812",
  "examples/ws2812",
  "common/indicator",
  "examples/indicator",
  "common/fs/block",
  "common/fs/fat16",
  "common/stream/rolling",
  "common/usb/msc",
    "examples/firmware/ota-supervised/component",
    "examples/firmware/ota-supervised",
    "common/firmware/component/abi",
    "common/firmware/component/image",
    "common/firmware/component/native",
    "common/firmware/component/sdk",
    "tools/component-pack",
  "examples/firmware/ota-system",
  "arch/esp32/firmware/boot",
  "examples/firmware/bootloader",
  "arch/esp32/firmware/a",
  "arch/esp32/firmware/supervisor",
  "arch/esp32/firmware/storage",
  "common/firmware/update",
  "common/firmware/layout",
  "common/firmware/boot",
  "common/firmware/image",
  "common/firmware/slots",
  "arch/esp32/watchdog",
  "common/log/stream",
  "common/net/mdns",
  "common/time/ntp",
  "examples/https-health",
  "examples/https-client",
  "common/net/http/tls",
  "arch/esp32/crypto/rng",
  "arch/esp32/net/tcp",
  "arch/esp32/net/tls",
  "common/net/tls/service",
  "arch/esp32/crypto/mbedtls",
  "common/time/core",
  "common/crypto/core",
  "common/crypto/rng",
  "common/net/tls/core",
  "common/net/tls/roots",
  "common/net/http/server",
  "common/net/io",
  "common/net/http/client",
  "common/log/core",
  "arch/esp32/log/console",
  "common/log/config",
  "common/config/space",
  "common/net/wifi/core",
  "common/net/improv/serial",
  "common/net/improv/provisioning",
  "common/net/wifi/manager",
  "arch/esp32/net/wifi",
  "examples/config-manager",
  "examples/wifi-modes",
  "arch/esp32/config/space",
  "arch/esp32/flash",
  "arch/esp32/flash/partitions",
]
default-members = [
  "common/log/core",
  "common/config/space",
  "common/net/wifi/core",
  "common/net/wifi/manager",
  "common/net/improv/serial",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/iobewi/rust-mcu-libs"

# Bootloader must fit before the partition table, with historical size settings.
[profile.bootloader]
inherits = "release"
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
debug = 2
overflow-checks = false
