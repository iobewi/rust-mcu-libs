[package]
name = "iobewi-firmware-update"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable firmware artifact streaming and update transaction engine"

[dependencies]
iobewi-firmware-image = { path = "../image", features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }

[features]
default = []
runtime = ["dep:embassy-sync", "dep:embassy-time", "dep:embassy-futures"]

[dependencies.embassy-sync]
version = "0.8.0"
optional = true

[dependencies.embassy-time]
version = "0.5.0"
optional = true

[dependencies.embassy-futures]
version = "0.1"
optional = true

[dev-dependencies]
critical-section = { version = "1.2", features = ["std"] }
embassy-time = { version = "0.5.0", features = ["std", "generic-queue-8"] }
