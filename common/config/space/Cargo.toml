[package]
name = "iobewi-config-space"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable no-std ownership and quota manager for component configuration spaces"
readme = "README.md"
keywords = ["embedded", "configuration", "no-std"]
categories = ["embedded", "no-std"]

[dependencies]
# Fixed persisted profile: requalify format/configuration on upgrades.
ekv = { version = "=1.0.0", features = ["crc", "max-value-size-8192", "max-chunk-size-256"] }
embassy-sync = "0.6.2"

[dev-dependencies]
critical-section = { version = "1.2", features = ["std"] }

[[example]]
name = "qualify_ekv"
test = true
