[package]
name = "iobewi-usb-msc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
usb-debug = ["embassy-usb/log"]

[dependencies]
iobewi-block = { path = "../../fs/block" }
embassy-usb = { version = "0.6.0", default-features = false }
embassy-time = { version = "0.5.1", default-features = false }
log = { version = "0.4", default-features = false }

[dev-dependencies]
embassy-futures = "0.1.2"
iobewi-fat16 = { path = "../../fs/fat16" }
iobewi-rolling-stream = { path = "../../stream/rolling" }
embassy-time = { version = "0.5.1", features = ["std", "generic-queue-8"] }
critical-section = { version = "1.2", features = ["std"] }
